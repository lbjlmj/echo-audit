# Echo 审计作业平台 — 六容器部署（TECH_DESIGN §2.1/§4.7）
# web / api / worker / beat / pg / redis（+ migrate 一次性迁移容器）
# 对象存储采用本地文件卷（objects_data），不引入 MinIO（开源版已归档停止维护）；
# 静态加密靠 OS 层（LUKS/BitLocker），归档 WORM 靠 chattr +a（见 storage.py）
# 全离线安装：deploy/offline-installer（镜像 tar + 初始化向导，目标 2 小时/所）

services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: ${ECHO_PG_PASSWORD:-echo}
      POSTGRES_DB: echo_audit
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo_audit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性迁移容器：表结构唯一来源（alembic env.py 读 ECHO_DATABASE_URL）
  migrate:
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: &backend_env
      ECHO_DATABASE_URL: postgresql+psycopg://echo:${ECHO_PG_PASSWORD:-echo}@pg:5432/echo_audit
      ECHO_REDIS_URL: redis://redis:6379/0
      ECHO_STORAGE_DIR: /srv/data/objects  # 本地对象存储卷（见 volumes.objects_data）
      ECHO_JWT_SECRET: ${ECHO_JWT_SECRET:-change-me-in-production}
      ECHO_LLM_ENABLED: "false"        # 大模型通道默认关闭（§15-15）
      ECHO_SF_EXPRESS_ENABLED: "false" # 顺丰通道默认关闭（§15-9）
      ECHO_EGRESS_HOSTS: ""            # 出站白名单默认全关（§4.2.7）
    depends_on:
      pg:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    environment: *backend_env
    volumes:
      - objects_data:/srv/data/objects  # 出稿产物持久化（底稿/函证/报告/归档包）
    ports:
      - "8000:8000" # 演练/调试直连；生产可移除，统一走 web:8080 反代
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 依赖装在 uv 管理的 .venv，须以 uv run 启动（裸 celery 不在 PATH）
  worker:
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.workers.celery_app.celery_app", "worker", "-l", "info"]
    environment: *backend_env
    volumes:
      - objects_data:/srv/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.workers.celery_app.celery_app", "beat", "-l", "info"]
    environment: *backend_env
    volumes:
      - objects_data:/srv/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      # context 为仓库根：nginx.conf 在 deploy/ 下，须与 frontend/ 一同可见
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  objects_data:  # 出稿产物持久化卷（底稿/函证/报告/归档包/AI 留痕文件）
