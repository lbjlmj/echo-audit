[project]
name = "echo-audit-backend"
version = "0.1.0"
description = "Echo 审计作业平台后端（FastAPI，架构约束见 AGENTS.md）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "minio>=7.2",
    "openpyxl==3.1.5",
    "xlrd>=2.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
